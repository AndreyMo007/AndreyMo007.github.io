<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Real MAS Manager | Мессенджер</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
        }
        
        /* Страницы */
        .page {
            display: none;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }
        
        .page.active {
            display: block;
        }
        
        /* Карточки */
        .card {
            background: #1a1a2e;
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid #2a2a3e;
        }
        
        h2, h3 {
            margin-bottom: 16px;
            color: #00d4ff;
        }
        
        input, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        
        input {
            background: #2a2a3a;
            color: white;
            outline: none;
            border: 1px solid #3a3a4a;
        }
        
        input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.2);
        }
        
        button {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }
        
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .password-wrapper input {
            flex: 1;
            padding-right: 50px;
        }
        
        .toggle-eye {
            position: absolute;
            right: 12px;
            cursor: pointer;
            background: transparent;
            width: auto;
            padding: 8px;
            margin: 0;
            font-size: 20px;
            color: #888;
        }
        
        .toggle-eye:hover {
            transform: none;
            box-shadow: none;
            background: transparent;
        }
        
        hr {
            margin: 20px 0;
            border-color: #2a2a3e;
        }
        
        /* Навигация */
        .nav-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #1a1a2e;
            padding: 12px;
            border-radius: 60px;
            position: sticky;
            top: 10px;
            z-index: 100;
        }
        
        .nav-btn {
            flex: 1;
            text-align: center;
            padding: 12px;
            background: #2a2a3a;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .nav-btn:hover {
            background: #3a3a4a;
        }
        
        .nav-btn.active-nav {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
        }
        
        /* Аватар */
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 60px;
            object-fit: cover;
            margin: 10px auto;
            display: block;
            border: 3px solid #00d4ff;
        }
        
        .avatar-placeholder {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 14px;
        }
        
        /* Контакты и чаты */
        .contact-item, .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #2a2a3a;
            margin: 10px 0;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .contact-item:hover, .chat-item:hover {
            background: #3a3a4a;
            transform: translateX(5px);
        }
        
        .contact-name, .chat-name {
            font-weight: 600;
            font-size: 16px;
        }
        
        .chat-preview {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }
        
        .chat-info {
            flex: 1;
        }
        
        .search-result-btn {
            margin: 5px 0;
            background: #2a2a3a;
            font-size: 14px;
        }
        
        /* Чат */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 70vh;
            background: #1a1a2e;
            border-radius: 28px;
            overflow: hidden;
        }
        
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        
        .message {
            margin: 8px 0;
            max-width: 75%;
        }
        
        .sent {
            align-self: flex-end;
        }
        
        .received {
            align-self: flex-start;
        }
        
        .message-bubble {
            padding: 10px 14px;
            border-radius: 20px;
            background: #2a2a3a;
        }
        
        .sent .message-bubble {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
        }
        
        .message-text {
            font-size: 15px;
            word-wrap: break-word;
        }
        
        .message-time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }
        
        .input-area {
            display: flex;
            gap: 12px;
            padding: 16px;
            background: #1a1a2e;
            border-top: 1px solid #2a2a3e;
        }
        
        .input-area input {
            flex: 1;
            margin: 0;
            background: #2a2a3a;
        }
        
        .input-area button {
            width: auto;
            padding: 14px 24px;
            margin: 0;
        }
        
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .chat-header button {
            width: auto;
            padding: 10px 20px;
            background: #2a2a3a;
            margin: 0;
        }
        
        #searchResults {
            margin-top: 12px;
        }
        
        #searchResults button {
            margin: 6px 0;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #00d4ff;
            border-radius: 3px;
        }
        
        .empty-state {
            text-align: center;
            color: #888;
            padding: 40px;
        }
        
        .back-btn {
            background: #2a2a3a !important;
            width: auto !important;
            padding: 10px 20px !important;
        }
    </style>
</head>
<body>
    <!-- Страница входа -->
    <div id="loginPage" class="page active">
        <div class="card">
            <h2>✨ Real MAS Manager</h2>
            <p style="margin-bottom: 20px;">Современный мессенджер</p>
            
            <h3>🔐 Вход</h3>
            <input type="email" id="loginEmail" placeholder="Электронная почта">
            <div class="password-wrapper">
                <input type="password" id="loginPassword" placeholder="Пароль">
                <button class="toggle-eye" onclick="togglePassword('loginPassword', 'eyeLogin')">👁️</button>
            </div>
            <button onclick="login()">Войти</button>
            <button onclick="forgotPassword()" style="background: #3a3a4a;">Забыли пароль?</button>
            
            <hr>
            
            <h3>📝 Регистрация</h3>
            <input type="email" id="regEmail" placeholder="Электронная почта">
            <input type="text" id="regUsername" placeholder="Никнейм (уникальный)">
            <div class="password-wrapper">
                <input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)">
                <button class="toggle-eye" onclick="togglePassword('regPassword', 'eyeReg')">👁️</button>
            </div>
            <div class="password-wrapper">
                <input type="password" id="regConfirm" placeholder="Повторите пароль">
                <button class="toggle-eye" onclick="togglePassword('regConfirm', 'eyeConf')">👁️</button>
            </div>
            <input type="file" id="regAvatar" accept="image/*">
            <button onclick="register()">Зарегистрироваться</button>
            
            <div id="verificationSection" style="display:none; margin-top: 20px;">
                <input type="text" id="verificationCode" placeholder="Введите 6-значный код из письма">
                <button id="verifyCodeBtn" style="background: #4caf50;">Подтвердить</button>
            </div>
        </div>
    </div>
    
    <!-- Главное приложение (мессенджер) -->
    <div id="mainApp" class="page">
        <!-- Навигация -->
        <div class="nav-bar">
            <div class="nav-btn" data-tab="profile">👤 Профиль</div>
            <div class="nav-btn" data-tab="chats">💬 Чаты</div>
            <div class="nav-btn" data-tab="contacts">📞 Контакты</div>
            <div class="nav-btn" onclick="logout()">🚪 Выйти</div>
        </div>
        
        <!-- Профиль -->
        <div id="profileTab" class="tab-content">
            <div class="card">
                <img id="profileAvatar" class="profile-avatar" src="https://via.placeholder.com/120?text=User">
                <p><strong>📧 Почта:</strong> <span id="profileEmail">—</span></p>
                <p><strong>👤 Ник:</strong> <span id="profileUsername">—</span></p>
                <input type="file" id="newAvatarInput" accept="image/*">
                <button onclick="updateProfileAvatar()">🖼️ Обновить аватар</button>
            </div>
        </div>
        
        <!-- Чаты -->
        <div id="chatsTab" class="tab-content" style="display: none;">
            <div class="card">
                <h3>💬 Активные чаты</h3>
                <div id="chatsList"></div>
            </div>
        </div>
        
        <!-- Контакты -->
        <div id="contactsTab" class="tab-content" style="display: none;">
            <div class="card">
                <h3>🔍 Поиск контакта</h3>
                <input type="text" id="searchNickname" placeholder="Введите никнейм">
                <button onclick="searchContact()">Найти</button>
                <div id="searchResults"></div>
                
                <h3 style="margin-top: 25px;">📋 Мои контакты</h3>
                <div id="contactsList"></div>
            </div>
        </div>
    </div>
    
    <!-- Страница чата (отдельная) -->
    <div id="chatPage" class="page">
        <div class="chat-header">
            <button class="back-btn" onclick="closeChat()">← Назад</button>
            <h3 id="chatHeaderName">Чат</h3>
            <div style="width: 60px;"></div>
        </div>
        <div class="chat-container">
            <div class="messages-area" id="messagesContainer">
                <div class="empty-state">💬 Выберите чат</div>
            </div>
            <div class="input-area">
                <input id="messageInput" placeholder="Введите сообщение..." autocomplete="off">
                <button onclick="sendMessage()">📤</button>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, updateProfile, onAuthStateChanged, fetchSignInMethodsForEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, updateDoc, arrayUnion, onSnapshot, addDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        
        // Firebase конфиг
        const firebaseConfig = {
            apiKey: "AIzaSyA0ML0f4E-nAjUL5qaDcjzw8Ea8K94tjlQ",
            authDomain: "messenger-mas.firebaseapp.com",
            projectId: "messenger-mas",
            storageBucket: "messenger-mas.firebasestorage.app",
            messagingSenderId: "60936666061",
            appId: "1:60936666061:web:c5218d35e9e54f9ebee284"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        
        // EmailJS
        emailjs.init("popGxqPJLrqP3ySB4");
        
        // Глобальные переменные
        let currentUserData = null;
        let unsubscribeContacts = null;
        let unsubscribeMessages = null;
        let activeChatId = null;
        let activeOtherUser = null;
        let pendingRegistrations = new Map();
        
        // Функции навигации по табам
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            document.getElementById(`${tabName}Tab`).style.display = 'block';
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active-nav');
            });
            document.querySelector(`[data-tab="${tabName}"]`)?.classList.add('active-nav');
        }
        
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }
        
        window.closeChat = function() {
            if (unsubscribeMessages) {
                unsubscribeMessages();
                unsubscribeMessages = null;
            }
            showPage('mainApp');
            switchTab('chats');
        };
        
        window.togglePassword = function(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (field && icon) {
                field.type = field.type === "password" ? "text" : "password";
                icon.textContent = field.type === "password" ? "👁️" : "🙈";
            }
        };
        
        // Отправка кода
        async function sendVerificationCode(email, code, type) {
            try {
                await emailjs.send("service_bmmno0o", "template_wlrjvkf", {
                    to_email: email,
                    verification_code: code,
                    message_type: type === 'register' ? 'Код подтверждения регистрации' : 'Код восстановления пароля'
                });
                return true;
            } catch (error) {
                console.error("EmailJS error:", error);
                alert("Ошибка отправки письма. Проверьте интернет.");
                return false;
            }
        }
        
        function generateCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }
        
        // Регистрация
        window.register = async function() {
            const email = document.getElementById('regEmail').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const avatarFile = document.getElementById('regAvatar').files[0];
            
            if (!email || !username || !password || !confirm) {
                alert("Заполните все поля!");
                return;
            }
            if (password !== confirm) {
                alert("Пароли не совпадают!");
                return;
            }
            if (password.length < 6) {
                alert("Пароль минимум 6 символов!");
                return;
            }
            
            // Проверка уникальности ника
            const usersRef = collection(db, "users");
            const q = query(usersRef, where("username", "==", username));
            const querySnap = await getDocs(q);
            if (!querySnap.empty) {
                alert("Этот ник уже занят!");
                return;
            }
            
            const code = generateCode();
            const sent = await sendVerificationCode(email, code, 'register');
            if (!sent) return;
            
            pendingRegistrations.set(email, { code, expires: Date.now() + 5 * 60000, username, password, avatarFile });
            alert("Код отправлен на почту!");
            document.getElementById('verificationSection').style.display = 'block';
            document.getElementById('verifyCodeBtn').onclick = () => verifyRegister(email);
        };
        
        async function verifyRegister(email) {
            const inputCode = document.getElementById('verificationCode').value.trim();
            const pending = pendingRegistrations.get(email);
            
            if (!pending || pending.expires < Date.now()) {
                alert("Код истёк или не найден");
                return;
            }
            if (inputCode !== pending.code) {
                alert("Неверный код!");
                return;
            }
            
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, pending.password);
                const user = userCred.user;
                
                let photoURL = "";
                if (pending.avatarFile) {
                    const storageRef = ref(storage, `avatars/${user.uid}`);
                    await uploadBytes(storageRef, pending.avatarFile);
                    photoURL = await getDownloadURL(storageRef);
                }
                
                await updateProfile(user, { displayName: pending.username, photoURL });
                await setDoc(doc(db, "users", user.uid), {
                    username: pending.username,
                    email: email,
                    photoURL: photoURL,
                    createdAt: new Date(),
                    contacts: []
                });
                
                pendingRegistrations.delete(email);
                alert("Регистрация успешна! Войдите в аккаунт.");
                showPage('loginPage');
                document.getElementById('verificationSection').style.display = 'none';
                document.getElementById('regForm')?.reset();
            } catch (err) {
                alert("Ошибка: " + err.message);
            }
        }
        
        // Вход
        window.login = async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                alert("Введите почту и пароль");
                return;
            }
            
            try {
                const userCred = await signInWithEmailAndPassword(auth, email, password);
                alert("Вход выполнен!");
                await loadMainApp(userCred.user);
            } catch (err) {
                alert("Ошибка входа: " + err.message);
            }
        };
        
        // Восстановление пароля
        window.forgotPassword = async function() {
            const email = prompt("Введите вашу почту:");
            if (!email) return;
            
            try {
                await sendPasswordResetEmail(auth, email);
                alert(`Ссылка для сброса пароля отправлена на ${email}`);
            } catch (err) {
                alert("Ошибка: " + err.message);
            }
        };
        
        // Загрузка главного приложения
        async function loadMainApp(user) {
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (!userDoc.exists()) return;
            
            currentUserData = { uid: user.uid, ...userDoc.data() };
            
            // Загружаем данные в профиль
            document.getElementById('profileEmail').innerText = currentUserData.email;
            document.getElementById('profileUsername').innerText = currentUserData.username;
            if (currentUserData.photoURL) {
                document.getElementById('profileAvatar').src = currentUserData.photoURL;
            }
            
            // Загружаем контакты и чаты
            await loadContactsList();
            await loadChatsList();
            
            // Подписка на обновления
            if (unsubscribeContacts) unsubscribeContacts();
            unsubscribeContacts = onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                if (docSnap.exists()) {
                    currentUserData.contacts = docSnap.data().contacts || [];
                    loadContactsList();
                    loadChatsList();
                }
            });
            
            showPage('mainApp');
            switchTab('profile');
            
            // Навигация по табам
            document.querySelectorAll('.nav-btn[data-tab]').forEach(btn => {
                btn.onclick = () => switchTab(btn.getAttribute('data-tab'));
            });
        }
        
        window.updateProfileAvatar = async function() {
            const file = document.getElementById('newAvatarInput').files[0];
            if (!file) return;
            
            const user = auth.currentUser;
            const storageRef = ref(storage, `avatars/${user.uid}`);
            await uploadBytes(storageRef, file);
            const url = await getDownloadURL(storageRef);
            await updateProfile(user, { photoURL: url });
            await updateDoc(doc(db, "users", user.uid), { photoURL: url });
            currentUserData.photoURL = url;
            document.getElementById('profileAvatar').src = url;
            alert("Аватар обновлён!");
        };
        
        async function loadContactsList() {
            const container = document.getElementById('contactsList');
            const contacts = currentUserData?.contacts || [];
            
            if (contacts.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 Нет контактов. Добавьте через поиск.</div>';
                return;
            }
            
            container.innerHTML = contacts.map(contact => `
                <div class="contact-item" onclick="openChat('${contact.uid}', '${escapeHtml(contact.username)}')">
                    <div class="avatar-placeholder">👤</div>
                    <span class="contact-name">${escapeHtml(contact.username)}</span>
                </div>
            `).join('');
        }
        
        async function loadChatsList() {
            const container = document.getElementById('chatsList');
            const contacts = currentUserData?.contacts || [];
            
            if (contacts.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 Нет чатов. Добавьте контакты.</div>';
                return;
            }
            
            container.innerHTML = contacts.map(contact => `
                <div class="chat-item" onclick="openChat('${contact.uid}', '${escapeHtml(contact.username)}')">
                    <div class="avatar-placeholder">💬</div>
                    <div class="chat-info">
                        <div class="chat-name">${escapeHtml(contact.username)}</div>
                        <div class="chat-preview">Нажмите для чата</div>
                    </div>
                </div>
            `).join('');
        }
        
        window.searchContact = async function() {
            const nick = document.getElementById('searchNickname').value.trim();
            if (!nick) return;
            
            const usersRef = collection(db, "users");
            const q = query(usersRef, where("username", ">=", nick), where("username", "<=", nick + "\uf8ff"));
            const snapshot = await getDocs(q);
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = "";
            
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (data.username !== currentUserData?.username) {
                    const already = currentUserData?.contacts?.some(c => c.uid === docSnap.id);
                    const btn = document.createElement("button");
                    btn.className = "search-result-btn";
                    if (already) {
                        btn.innerText = `✅ ${data.username} (уже в контактах)`;
                        btn.disabled = true;
                    } else {
                        btn.innerText = `➕ Добавить ${data.username}`;
                        btn.onclick = () => addContact(docSnap.id, data.username);
                    }
                    resultsDiv.appendChild(btn);
                }
            });
            
            if (resultsDiv.children.length === 0) {
                resultsDiv.innerHTML = "<p>❌ Пользователь не найден</p>";
            }
        };
        
        async function addContact(contactUid, contactUsername) {
            const userRef = doc(db, "users", auth.currentUser.uid);
            await updateDoc(userRef, {
                contacts: arrayUnion({ uid: contactUid, username: contactUsername })
            });
            alert(`✅ ${contactUsername} добавлен в контакты`);
            document.getElementById('searchNickname').value = '';
            document.getElementById('searchResults').innerHTML = '';
        }
        
        window.openChat = function(otherUid, otherUsername) {
            activeChatId = [auth.currentUser.uid, otherUid].sort().join('_');
            activeOtherUser = { uid: otherUid, username: otherUsername };
            document.getElementById('chatHeaderName').innerHTML = `${escapeHtml(otherUsername)} 💬`;
            showPage('chatPage');
            loadMessages();
        };
        
        function loadMessages() {
            if (unsubscribeMessages) unsubscribeMessages();
            
            const messagesRef = collection(db, "chats", activeChatId, "messages");
            const q = query(messagesRef, orderBy("timestamp", "asc"));
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                const container = document.getElementById('messagesContainer');
                container.innerHTML = "";
                const currentUid = auth.currentUser.uid;
                
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const div = document.createElement('div');
                    div.className = msg.senderId === currentUid ? 'message sent' : 'message received';
                    const time = msg.timestamp?.toDate ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                    div.innerHTML = `<div class="message-bubble"><div class="message-text">${escapeHtml(msg.text)}</div><div class="message-time">${time}</div></div>`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
        }
        
        window.sendMessage = async function() {
            const text = document.getElementById('messageInput').value.trim();
            if (!text || !activeChatId) return;
            
            const messagesRef = collection(db, "chats", activeChatId, "messages");
            await addDoc(messagesRef, {
                text: text,
                senderId: auth.currentUser.uid,
                timestamp: new Date()
            });
            document.getElementById('messageInput').value = "";
        };
        
        window.logout = function() {
            auth.signOut();
            if (unsubscribeContacts) unsubscribeContacts();
            if (unsubscribeMessages) unsubscribeMessages();
            currentUserData = null;
            showPage('loginPage');
        };
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Проверка авторизации
        onAuthStateChanged(auth, async (user) => {
            if (user && !currentUserData) {
                await loadMainApp(user);
            } else if (!user && document.getElementById('mainApp').classList.contains('active')) {
                showPage('loginPage');
            }
        });
        
        // Enter для отправки сообщения
        document.addEventListener('keypress', (e) => {
            if (e.target.id === 'messageInput' && e.key === 'Enter') {
                window.sendMessage();
            }
        });
    </script>
</body>
</html>
